name: Publication

# Un tag « vX.Y.Z » suffit : l'archive publiée ici est celle que l'application
# télécharge par sa fenêtre de mise à jour (SeptPaceAuto-win-x64.zip).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Construire et publier l'archive Windows
    runs-on: windows-latest

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publier l'application
        shell: pwsh
        run: ./build/publish.ps1 -Version "${{ github.ref_name }}"

      - name: Vérifier l'archive
        shell: pwsh
        run: |
          $archive = 'artifacts/SeptPaceAuto-win-x64.zip'
          if (-not (Test-Path -LiteralPath $archive)) { throw "Archive absente : $archive" }
          Get-Item -LiteralPath $archive | Select-Object Name, Length

      - name: Créer la publication GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/SeptPaceAuto-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
