name: Publication

# Un tag « vX.Y.Z » suffit : il produit l'installateur 7pace-auto-setup.msi et l'archive
# SeptPaceAuto-win-x64.zip, celle que l'application télécharge pour se mettre à jour.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Construire et publier l'installateur et l'archive
    runs-on: windows-latest

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Installer l'outil WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Publier l'application et construire l'installateur
        shell: pwsh
        run: ./build/publish.ps1 -Version "${{ github.ref_name }}"

      - name: Vérifier les artefacts
        shell: pwsh
        run: |
          $attendus = 'artifacts/SeptPaceAuto-win-x64.zip', 'artifacts/7pace-auto-setup.msi'
          foreach ($fichier in $attendus) {
            if (-not (Test-Path -LiteralPath $fichier)) { throw "Artefact absent : $fichier" }
          }
          Get-Item -LiteralPath $attendus | Select-Object Name, Length

      - name: Créer la publication GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            artifacts/7pace-auto-setup.msi
            artifacts/SeptPaceAuto-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
