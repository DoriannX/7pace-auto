name: Publication

# Un tag « vX.Y.Z » suffit : il produit l'archive terminal que l'application
# télécharge pour se mettre à jour.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Construire et publier le terminal
    runs-on: windows-latest

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publier le terminal
        shell: pwsh
        run: ./build/publish.ps1 -Version "${{ github.ref_name }}"

      - name: Vérifier les artefacts
        shell: pwsh
        run: |
          $attendu = 'artifacts/SeptPaceAuto.Terminal-win-x64.zip'
          if (-not (Test-Path -LiteralPath $attendu)) { throw "Artefact absent : $attendu" }
          Get-Item -LiteralPath $attendu | Select-Object Name, Length

      - name: Créer la publication GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/SeptPaceAuto.Terminal-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
