name: Publication

# Un tag « vX.Y.Z » suffit : il produit l'archive que l'application
# télécharge pour se mettre à jour.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Construire et publier le collecteur et l'app
    runs-on: windows-latest

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Vérifier la compilation
        shell: pwsh
        run: |
          # Le dépôt n'a pas de fichier solution : chaque projet d'entrée est compilé
          # explicitement, sinon MSBuild ne trouve rien à la racine.
          foreach ($projet in @('src/SeptPaceAuto.Agent', 'tests/SeptPaceAuto.Tests')) {
            dotnet build $projet -c Release -warnaserror --nologo
            if ($LASTEXITCODE -ne 0) { throw "La compilation de $projet a échoué." }
          }
          corepack pnpm --dir app install --frozen-lockfile
          corepack pnpm --dir app test
          if ($LASTEXITCODE -ne 0) { throw "Les tests de l'app ont échoué." }

      - name: Publier le collecteur et l'app
        shell: pwsh
        run: ./build/publish.ps1 -Version "${{ github.ref_name }}"

      - name: Vérifier les artefacts
        shell: pwsh
        run: |
          $attendu = 'artifacts/SeptPaceAuto-win-x64.zip'
          if (-not (Test-Path -LiteralPath $attendu)) { throw "Artefact absent : $attendu" }

          # La mise à jour automatique refuse une archive amputée : autant le voir ici.
          Add-Type -AssemblyName 'System.IO.Compression.FileSystem'
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $attendu))
          try {
            foreach ($nom in @('SeptPaceAuto.Agent.exe', 'SeptPaceAuto.App.exe')) {
              if (-not ($archive.Entries | Where-Object { $_.FullName -eq $nom })) {
                throw "L'archive ne contient pas $nom a sa racine."
              }
            }
          } finally {
            $archive.Dispose()
          }
          Get-Item -LiteralPath $attendu | Select-Object Name, Length

      - name: Créer la publication GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/SeptPaceAuto-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
